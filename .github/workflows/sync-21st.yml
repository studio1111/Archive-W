name: Sync 21st catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-21st.mjs
      - name: Commit catalog
        run: |
          git config user.name "archive-w-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/21st-catalog.json
          git diff --cached --quiet || git commit -m "chore: sync 21st catalog"
          git push
